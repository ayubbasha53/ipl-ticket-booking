# Local MongoDB as a single-node replica set so multi-document transactions work.
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 10
  mongo-init:
    image: mongo:7
    depends_on:
      mongo: { condition: service_healthy }
    restart: "no"
    entrypoint: >
      mongosh --host mongo --quiet --eval
      "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }"
volumes:
  mongo-data:
